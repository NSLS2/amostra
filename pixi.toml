[workspace]
authors = ["vshekar1 <vshekar1@bnl.gov>"]
channels = ["conda-forge"]
name = "amostra"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# Usage: pixi run start -- --mongo_uri mongodb://localhost:27017 --database amostra --service_port 7770
start = "python -m amostra.startup"

[dependencies]
python = "3.11.*"
doct = ">=1.1.0,<2"
jsonschema = ">=4.26.0,<5"
mongoquery = ">=1.4.3,<2"
pymongo = ">=4.17.0,<5"
pyyaml = ">=6.0.3,<7"
requests = ">=2.34.2,<3"
six = ">=1.17.0,<2"
tornado = ">=6.5.8,<7"
ujson = ">=5.13.0,<6"
mongomock = ">=4.3.0,<5"
pytest = ">=9.1.1,<10"
setuptools = ">=70,<81"
